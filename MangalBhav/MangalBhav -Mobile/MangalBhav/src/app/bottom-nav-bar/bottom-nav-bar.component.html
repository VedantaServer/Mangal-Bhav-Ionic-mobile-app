<div class="mb-nav-wrapper" #navWrapper>
  <svg class="mb-curve-svg" [attr.viewBox]="'0 0 ' + navWidth + ' 70'"
       preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path [attr.d]="currentPath" fill="#ffffff" />
  </svg>

  <div class="mb-tab-row">
    <div class="mb-tab-btn" *ngFor="let tab of tabs"
         [class.tab-active]="isActive(tab)"
         (click)="onTabClick(tab)">

      <ng-container *ngIf="tab.id !== 'community'; else communityIcon">
        <div class="mb-active-fab">
          <img [src]="tab.icon" class="mb-fab-img" [style.border-radius]="tab.round ? '50%' : null" />
        </div>
        <img [src]="tab.icon" class="mb-tab-img"
             [style.border-radius]="tab.round ? '50%' : null"
             [style.width.px]="tab.round ? 46 : null"
             [style.height.px]="tab.round ? 46 : null" />
      </ng-container>

      <ng-template #communityIcon>
        <div class="mb-active-fab">
          <ng-container *ngIf="isActive(tab); else roundIcon">
            <ion-icon name="add" class="community-plus"></ion-icon>
          </ng-container>
          <ng-template #roundIcon>
            <img [src]="tab.icon" class="mb-fab-img" style="border-radius:50%;" />
          </ng-template>
        </div>
        <img *ngIf="!isActive(tab)" [src]="tab.icon" class="mb-tab-img"
             style="border-radius:50%;width:46px;height:46px;" />
      </ng-template>

      <span class="mb-tab-label" *ngIf="tab.label">{{ tab.label }}</span>
    </div>
  </div>
</div>
