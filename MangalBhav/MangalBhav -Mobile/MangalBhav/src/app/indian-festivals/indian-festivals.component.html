<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="inner-header">
      <button class="inner-back-btn" (click)="routerCtrl.back()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>
      <div class="inner-title-block">
        <div class="inner-title">{{ t.title }}</div>
        <div class="inner-title-sub">{{ t.sub }}</div>
      </div>
      <div class="inner-logo">
        <img src="../../assets/mangalbhavlogo1.jpeg" />
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content #ionContent [scrollEvents]="true">

  <div class="festival-page-wrap">

    <div class="feed-reels-wrap">

      <ng-container *ngFor="let entry of panchangEntries">

        <div class="feed-date-header">
          <span class="fdh-line"></span>
          <span class="fdh-label">{{ entry.dateLabel }}</span>
          <span class="fdh-line"></span>
        </div>

        <div class="reel-card panchang-card" *ngIf="entry.panchangImage || entry.panchangLoading">
          <img *ngIf="entry.panchangImage" [src]="entry.panchangImage" class="panchang-img" />

          <button class="panchang-share-btn" *ngIf="entry.panchangImage" (click)="sharePanchangImage(entry)">
            <ion-icon name="share-social-outline"></ion-icon>
            <span>शेयर करें</span>
          </button>

          <div class="panchang-loading" *ngIf="entry.panchangLoading && !entry.panchangImage">
            <ion-spinner name="crescent" color="warning"></ion-spinner>
            <span>पंचांग लोड हो रहा है...</span>
          </div>
        </div>
      </ng-container>

      <div class="feed-empty" *ngIf="!panchangEntries.length && !panchangFeedLoading">
        <span>🪔 अभी कोई पंचांग उपलब्ध नहीं</span>
      </div>

      <ion-infinite-scroll (ionInfinite)="onPanchangInfiniteScroll($event)" [disabled]="panchangAllLoaded">
        <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="और पंचांग लोड हो रहे हैं...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>

    </div>

  </div>
</ion-content>
