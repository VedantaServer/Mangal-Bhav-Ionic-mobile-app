<app-tabscommonheader></app-tabscommonheader>

<ion-content>

  <div style="
    width:100%;
    background:#1a0a00;">

    <!-- Hanuman Ji Image -->
    <img src="assets/hanumanji.png" style="
            width:100%;
            height:auto;
            display:block;
        " />
    <!-- Falling Flowers Canvas -->
    <canvas id="flowerCanvas" style="
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
  "></canvas>
    <!-- Aarti Button -->
    <div style="
        display:flex;
        justify-content:center;
        padding:16px 0 20px 0;
        background:#1a0a00;
    ">
      <button (click)="playShankh()" style="
    background:linear-gradient(135deg, #ff6b00, #ff9500);
    color:white;
    border:none;
    padding:14px 40px;
    font-size:20px;
    border-radius:40px;
    font-weight:bold;
    box-shadow:0 4px 16px rgba(255,107,0,0.4);
    letter-spacing:0.5px;
">
        🪔 आरती करें
      </button>
    </div>

  </div>

 

    <!-- ═══ HERO ═══ -->
    <section class="comm-hero">
      <div class="comm-hero-bg-om">ॐ</div>
      <div class="comm-diya d1">🪔</div>
      <div class="comm-diya d2">🪔</div>
      <div class="comm-diya d3">🔥</div>
      <div class="comm-diya d4">🔥</div>

      <div class="comm-hero-inner">
        <div class="comm-hero-badge">🙏 &nbsp; Mangal.Bhav Community</div>
        <h1 class="comm-hero-title">मंगल भवः</h1>
        <p class="comm-hero-devanagari">शांति · समृद्धि · संरक्षण</p>
        <p class="comm-hero-desc">
          A sacred community rooted in the timeless wisdom of Vedic tradition —
          where every family finds peace, every home finds prosperity,
          and every soul finds protection.
        </p>
        <div class="comm-hero-pills">
          <span class="comm-pill">🌸 Peace</span>
          <span class="comm-pill">🌟 Prosperity</span>
          <span class="comm-pill">🛡️ Protection</span>
          <span class="comm-pill">🔥 Sacred Fire</span>
        </div>
      </div>
    </section>
    
</ion-content>


<app-panditjibottomtabs *ngIf="userDetails?.Role == 'PANDIT'"></app-panditjibottomtabs>

<app-jajmanbottomtabs *ngIf="userDetails?.Role == 'BHAKT'"></app-jajmanbottomtabs>


<app-loggedoutbottomtabs *ngIf="!userLoggedIn"></app-loggedoutbottomtabs>
